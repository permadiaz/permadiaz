<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive layout check</title><style>body{margin:0;background:#333;color:white;font:14px system-ui}header{padding:12px;display:flex;gap:14px;align-items:center}select{padding:8px}iframe{display:block;height:850px;border:0;margin:0 auto;background:#0d1210}#frame-holder{overflow:auto}</style></head><body><header><label for="size">Viewport width</label><select id="size"><option value="390">390px mobile</option><option value="320">320px mobile</option><option value="768">768px tablet</option></select><span id="result" role="status">Loading the deployed app…</span></header><div id="frame-holder"><iframe title="Responsive website preview" id="site-preview" width="390" allow="fullscreen"></iframe></div><script type="module">const frame=document.querySelector('iframe');const size=document.querySelector('select');size.addEventListener('change',()=>{frame.width=size.value;document.querySelector('#result').textContent=`Viewport ${size.value}px`;});const response=await fetch('/');if(!response.ok)throw new Error('Cannot load the deployed app');frame.srcdoc=(await response.text()).replace('<head>','<head><base href="/">');frame.addEventListener('load',()=>{document.querySelector('#result').textContent='Deployed app ready';});</script></body></html>
